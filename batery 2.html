<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Battery Interface</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --neon-red: #ff3131;
            --neon-blue: #00d2ff;
        }

        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Fon uchun kiber-to'r */
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            z-index: -1;
            animation: gridMove 10s linear infinite;
        }

        @keyframes gridMove {
            from { background-position: 0 0; }
            to { background-position: 0 500px; }
        }

        .main-box {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
            border: 2px solid rgba(0, 210, 255, 0.1);
        }

        /* Aylana Progress Bar */
        svg {
            position: absolute;
            width: 280px;
            height: 280px;
            transform: rotate(-90deg);
        }

        circle {
            fill: none;
            stroke-width: 15;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease, stroke 1s ease;
        }

        .bg-circle {
            stroke: rgba(255, 255, 255, 0.05);
        }

        .progress-circle {
            stroke: var(--neon-blue);
            stroke-dasharray: 754; /* 2 * PI * R (R=120) */
            stroke-dashoffset: 754;
            filter: drop-shadow(0 0 10px var(--neon-blue));
        }

        /* Markazdagi ma'lumotlar */
        .content {
            text-align: center;
            z-index: 10;
        }

        .percent {
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 20px var(--neon-blue);
            margin: 0;
        }

        .status-tag {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--neon-blue);
            margin-top: 10px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Quvvat olayotgan effekt */
        .charging-wave {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            opacity: 0;
            pointer-events: none;
        }

        .is-charging .charging-wave {
            animation: pulseWave 2s infinite;
        }

        @keyframes pulseWave {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="main-box" id="mainContainer">
        <div class="charging-wave"></div>
        
        <svg>
            <circle class="bg-circle" cx="140" cy="140" r="120"></circle>
            <circle class="progress-circle" id="progress" cx="140" cy="140" r="120"></circle>
        </svg>

        <div class="content">
            <p class="percent" id="percValue">0%</p>
            <p class="status-tag" id="statLabel">Tizim Tayyor</p>
        </div>
    </div>

    <script>
        const progress = document.getElementById('progress');
        const percValue = document.getElementById('percValue');
        const statLabel = document.getElementById('statLabel');
        const mainContainer = document.getElementById('mainContainer');

        const radius = 120;
        const circumference = 2 * Math.PI * radius;

        async function initBattery() {
            try {
                const battery = await navigator.getBattery();

                function updateUI() {
                    const level = battery.level;
                    const percentage = Math.round(level * 100);
                    
                    // Grafikani yangilash
                    const offset = circumference - (level * circumference);
                    progress.style.strokeDashoffset = offset;
                    percValue.innerText = percentage + "%";

                    // Ranglarni holatga qarab o'zgartirish
                    if (battery.charging) {
                        mainContainer.classList.add('is-charging');
                        statLabel.innerText = "Quvvatlanmoqda...";
                        statLabel.style.color = "var(--neon-green)";
                        progress.style.stroke = "var(--neon-green)";
                        percValue.style.textShadow = "0 0 20px var(--neon-green)";
                    } else {
                        mainContainer.classList.remove('is-charging');
                        statLabel.innerText = "Batareya Rejimi";
                        
                        if (percentage <= 20) {
                            progress.style.stroke = "var(--neon-red)";
                            statLabel.style.color = "var(--neon-red)";
                            percValue.style.textShadow = "0 0 20px var(--neon-red)";
                        } else {
                            progress.style.stroke = "var(--neon-blue)";
                            statLabel.style.color = "var(--neon-blue)";
                            percValue.style.textShadow = "0 0 20px var(--neon-blue)";
                        }
                    }
                }

                updateUI();
                
                // Voqealarni kuzatish
                battery.onlevelchange = () => updateUI();
                battery.onchargingchange = () => updateUI();

            } catch (e) {
                statLabel.innerText = "Xato: Kirish taqiqlandi";
            }
        }

        initBattery();
    </script>
</body>
</html>
